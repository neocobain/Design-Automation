<!DOCTYPE html>

<html>

<head>
    <title>Rail Design Automation</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Rail Design Automation</h1>

        <div class="card">

            <label>Template</label>

            <select id="template">

                <option>Regional Station</option>

                <option>Control Centre</option>

                <option>Data Centre</option>

            </select>

            <label>Project Name</label>

            <input
                id="project"
                placeholder="Project Name">

            <label>Site Name</label>

            <input
                id="site"
                placeholder="Site Name">


            <label>Router</label>

            <select id="router">

                <option>MX104</option>

                <option>MX304</option>

                <option>Cisco 4451</option>

            </select>

            <label>Firewall</label>

            <select id="firewall">

                <option>SRX4100</option>

                <option>PA-3420</option>

            </select>

            <button onclick="generate()">

                Generate Design

            </button>

        </div>

        <div id="result">

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
